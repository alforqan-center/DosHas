<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>On Fire Academy - مشغل الدروس الخاص</title>
    <link rel="icon" type="image/jpeg" href="https://i.postimg.cc/Fz97Zty5/Whats-App-Image-2026-09-10-at-2-49-35-AM.jpg">
    
    <!-- الخطوط الرسمية -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Cairo:wght@600;700;900&display=swap" rel="stylesheet">
    
    <!-- استيراد مكتبة Plyr للمشغل المخصص -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>

    <!-- فايربيس للأمان -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

    <style>
        :root {
            /* تخصيص اللون البرتقالي الرسمي لمنصة On Fire */
            --plyr-color-main: #ff6b00;
            --plyr-video-background: #000000;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            user-select: none;
        }
        body {
            background-color: #0b0f19;
            color: #cbd5e1;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 16px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #1e293b;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .site-logo {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #ff6b00;
        }
        .site-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .logo-area h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 20px;
            color: #fff;
        }
        .logo-area h1 span {
            color: #ff6b00;
        }
        .back-nav-btn {
            background: #1e293b;
            color: #cbd5e1;
            border: 1px solid #334155;
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .back-nav-btn:hover {
            background-color: #ff6b00;
            border-color: #ff6b00;
            color: #fff;
        }
        .container {
            flex: 1;
            max-width: 950px;
            margin: 25px auto;
            padding: 0 15px;
            width: 100%;
        }
        .player-card {
            background: #111827;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid #1f2937;
        }
        .lesson-header {
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #1e293b;
        }
        .lesson-title {
            color: #f9fafb;
            font-size: 18px;
            font-weight: 700;
        }
        
        .custom-player-wrapper {
            position: relative;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            border: 2px solid #1f2937;
        }

        /* درع حماية الشاشة لإخفاء عناصر يوتيوب العلوية ومنع الضغط عليها */
        .video-click-shield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(100% - 50px);
            z-index: 10;
            cursor: pointer;
            background: rgba(0,0,0,0);
        }

        .plyr {
            border-radius: 10px;
        }
    </style>

    <script>
        const firebaseConfig = { databaseURL: "https://doshas-e5d12-default-rtdb.firebaseio.com/" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const guardDb = firebase.database();

        async function checkStudentSession() {
            const activeCode = localStorage.getItem('activeStudentCode');
            if (!activeCode) { window.location.href = "index.html"; return; }
            try {
                const adminSnap = await guardDb.ref('settings/adminCode').once('value');
                if (adminSnap.exists() && activeCode === adminSnap.val()) return;
                const snap = await guardDb.ref('codes/' + activeCode).once('value');
                if (!snap.exists() || snap.val().status === 'inactive') {
                    localStorage.removeItem('activeStudentCode');
                    window.location.href = "index.html?expired=true";
                }
            } catch (e) {}
        }
        window.addEventListener('DOMContentLoaded', checkStudentSession);
    </script>
</head>
<body>

    <header>
        <div class="logo-area">
            <div class="site-logo">
                <img src="https://i.postimg.cc/Fz97Zty5/Whats-App-Image-2026-09-10-at-2-49-35-AM.jpg" alt="Logo">
            </div>
            <h1>On <span>Fire</span> ACADEMY</h1>
        </div>
        <button class="back-nav-btn" onclick="goBack()">← العودة للدروس</button>
    </header>

    <div class="container">
        <div class="player-card">
            <div class="lesson-header">
                <h2 class="lesson-title" id="displayLessonTitle">جاري تحميل الدرس...</h2>
            </div>

            <!-- حاوية المشغل الخاصة مع تعطيل كليك يمين -->
            <div class="custom-player-wrapper" id="mediaWrapper" oncontextmenu="return false;">
                <div class="video-click-shield" id="clickShield" onclick="togglePlayPause()"></div>
                <div id="plyrTarget"></div>
            </div>
        </div>
    </div>

    <script>
        let plyrInstance = null;

        function getSmartParam(paramName) {
            const href = window.location.href;
            const key = paramName + '=';
            const startIdx = href.indexOf(key);
            if (startIdx === -1) return null;
            let valStart = startIdx + key.length;
            let valEnd = href.length;

            if (paramName === 'url') {
                const nextTitle = href.indexOf('&title=', valStart);
                if (nextTitle !== -1) valEnd = nextTitle;
            } else if (paramName === 'title') {
                const nextFrom = href.indexOf('&from=', valStart);
                if (nextFrom !== -1) valEnd = nextFrom;
            }

            const rawVal = href.substring(valStart, valEnd);
            try { return decodeURIComponent(rawVal); } catch(e) { return rawVal; }
        }

        function extractYouTubeId(url) {
            if (!url) return null;
            const regExp = /(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=|shorts\/))([\w-]{11})/;
            const match = url.match(regExp);
            return (match && match[1]) ? match[1] : null;
        }

        // دالة جديدة لاستخراج ID فيديو Google Drive
        function extractGoogleDriveId(url) {
            if (!url) return null;
            const regExp = /(?:drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?.*id=)|docs\.google\.com\/file\/d\/)([a-zA-Z0-9_-]+)/;
            const match = url.match(regExp);
            return (match && match[1]) ? match[1] : null;
        }

        function cleanMediaUrl(url) {
            try {
                let parsed = new URL(url);
                return parsed.origin + parsed.pathname;
            } catch(e) {
                return url.split('?')[0];
            }
        }

        function isDirectVideo(url) {
            const clean = cleanMediaUrl(url).toLowerCase();
            return clean.endsWith('.mp4') || clean.endsWith('.webm') || clean.endsWith('.mov');
        }

        function togglePlayPause() {
            if (plyrInstance) {
                plyrInstance.togglePlay();
            }
        }

        function renderPlayer(rawUrl) {
            const wrapper = document.getElementById('mediaWrapper');
            const shield = document.getElementById('clickShield');
            
            if (plyrInstance) { 
                plyrInstance.destroy(); 
                plyrInstance = null; 
            }
            
            let currentTargetUrl = rawUrl.trim();

            // خيارات المشغل (تشمل أزرار التقديم والتأخير 10 ثوانٍ)
            const plyrControls = [
                'play-large',
                'rewind',       // زر -10 ثوانٍ
                'play',         // زر التشغيل/الإيقاف
                'fast-forward', // زر +10 ثوانٍ
                'progress',     // شريط التقدم
                'current-time', // الوقت الحالي
                'duration',     // الوقت الإجمالي
                'mute',
                'volume',
                'settings',
                'fullscreen'
            ];

            const ytId = extractYouTubeId(currentTargetUrl);
            const driveId = extractGoogleDriveId(currentTargetUrl);

            // 1. إذا كان الفيديو من YouTube
            if (ytId) {
                shield.style.display = 'block';
                wrapper.innerHTML = `
                    <div class="video-click-shield" id="clickShield" onclick="togglePlayPause()"></div>
                    <div id="plyrTarget" data-plyr-provider="youtube" data-plyr-embed-id="${ytId}"></div>
                `;

                plyrInstance = new Plyr('#plyrTarget', {
                    controls: plyrControls,
                    seekTime: 10,
                    youtube: { 
                        noCookie: true, 
                        rel: 0, 
                        showinfo: 0, 
                        iv_load_policy: 3, 
                        modestbranding: 1,
                        controls: 0,
                        disablekb: 1
                    }
                });
                return;
            }

            // 2. إذا كان الفيديو من Google Drive
            if (driveId) {
                shield.style.display = 'none';
                const driveStreamUrl = `https://lh3.googleusercontent.com/d/${driveId}`;
                wrapper.innerHTML = `
                    <video id="plyrTarget" controls playsinline style="width:100%;">
                        <source src="${driveStreamUrl}" type="video/mp4">
                    </video>`;

                plyrInstance = new Plyr('#plyrTarget', {
                    controls: plyrControls,
                    seekTime: 10
                });
                return;
            }

            // 3. إذا كان الفيديو رابط مباشر (.mp4, .webm, .mov)
            if (isDirectVideo(currentTargetUrl)) {
                shield.style.display = 'none';
                const cleanUrl = cleanMediaUrl(currentTargetUrl);
                wrapper.innerHTML = `
                    <video id="plyrTarget" controls playsinline style="width:100%;">
                        <source src="${cleanUrl}" type="video/mp4">
                        <source src="${currentTargetUrl}" type="video/mp4">
                    </video>`;

                plyrInstance = new Plyr('#plyrTarget', {
                    controls: plyrControls,
                    seekTime: 10
                });
                return;
            }

            // 4. تضمين كـ iframe لأي روابط أخرى
            shield.style.display = 'none';
            wrapper.innerHTML = `<iframe src="${currentTargetUrl}" style="width:100%; height:450px; border:0;" allowfullscreen></iframe>`;
        }

        window.onload = function() {
            const rawUrl = getSmartParam('url');
            const rawTitle = getSmartParam('title');
            if (rawTitle) document.getElementById('displayLessonTitle').innerText = rawTitle;
            if (rawUrl) renderPlayer(rawUrl);
        };

        // اختصارات الكيبورد (الأسهم للتقديم والتأخير بـ 10 ثوانٍ والمسطرة للتشغيل)
        document.addEventListener('keydown', function(e) {
            if (!plyrInstance) return;
            if (e.code === 'ArrowRight') {
                plyrInstance.forward(10);
            } else if (e.code === 'ArrowLeft') {
                plyrInstance.rewind(10);
            } else if (e.code === 'Space') {
                e.preventDefault();
                plyrInstance.togglePlay();
            }
        });

        // زر العودة الذكي والمضمون
        function goBack() {
            const fromParam = getSmartParam('from');
            if (fromParam) {
                window.location.href = fromParam;
                return;
            }
            if (document.referrer && document.referrer.trim() !== '' && document.referrer.includes(window.location.host)) {
                window.location.href = document.referrer;
                return;
            }
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = "first-prep.html";
            }
        }
    </script>
</body>
</html>
