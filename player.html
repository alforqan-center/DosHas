<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>On Fire Academy - مشغل الدروس الخاص</title>
    <link rel="icon" type="image/jpeg" href="https://i.postimg.cc/Fz97Zty5/Whats-App-Image-2026-09-10-at-2-49-35-AM.jpg">
    
    <!-- الخطوط الرسمية -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Cairo:wght@600;700;900&display=swap" rel="stylesheet">
    
    <!-- استيراد مكتبة Plyr للمشغل المخصص -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>

    <!-- فايربيس للأمان -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

    <style>
        :root {
            /* تخصيص ألوان الأزرار لتطابق On Fire */
            --plyr-color-main: #ff6b00;
            --plyr-video-background: #000000;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            user-select: none; /* منع تحديد النصوص */
        }
        body {
            background-color: #0b0f19;
            color: #cbd5e1;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 16px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #1e293b;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .site-logo {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #ff6b00;
        }
        .site-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .logo-area h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 20px;
            color: #fff;
        }
        .logo-area h1 span {
            color: #ff6b00;
        }
        .container {
            flex: 1;
            max-width: 950px;
            margin: 25px auto;
            padding: 0 15px;
            width: 100%;
        }
        .player-card {
            background: #111827;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid #1f2937;
        }
        .lesson-header {
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #1e293b;
        }
        .lesson-title {
            color: #f9fafb;
            font-size: 18px;
            font-weight: 700;
        }
        
        /* حاوية المشغل الخاصة */
        .custom-player-wrapper {
            position: relative;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            border: 2px solid #1f2937;
        }

        /* درع حماية الشاشة لتشغيل/إيقاف الفيديو ومنع الضغط على روابط يوتيوب */
        .video-click-shield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(100% - 50px); /* يغطي كل شيء ما عدا أزرار التحكم بالأسفل */
            z-index: 5;
            cursor: pointer;
            background: rgba(0,0,0,0);
        }

        .plyr {
            border-radius: 10px;
        }

        .player-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            gap: 10px;
            flex-wrap: wrap;
        }
        .control-btn {
            background: #ff6b00;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 13px;
            text-decoration: none;
            transition: 0.2s;
        }
        .control-btn:hover { background: #e65c00; }
        .secondary-btn { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; }
        .secondary-btn:hover { background: #334155; color: #fff; }
    </style>

    <script>
        const firebaseConfig = { databaseURL: "https://doshas-e5d12-default-rtdb.firebaseio.com/" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const guardDb = firebase.database();

        async function checkStudentSession() {
            const activeCode = localStorage.getItem('activeStudentCode');
            if (!activeCode) { window.location.href = "index.html"; return; }
            try {
                const adminSnap = await guardDb.ref('settings/adminCode').once('value');
                if (adminSnap.exists() && activeCode === adminSnap.val()) return;
                const snap = await guardDb.ref('codes/' + activeCode).once('value');
                if (!snap.exists() || snap.val().status === 'inactive') {
                    localStorage.removeItem('activeStudentCode');
                    window.location.href = "index.html?expired=true";
                }
            } catch (e) {}
        }
        window.addEventListener('DOMContentLoaded', checkStudentSession);
    </script>
</head>
<body>

    <header>
        <div class="logo-area">
            <div class="site-logo">
                <img src="https://i.postimg.cc/Fz97Zty5/Whats-App-Image-2026-09-10-at-2-49-35-AM.jpg" alt="Logo">
            </div>
            <h1>On <span>Fire</span> ACADEMY</h1>
        </div>
        <button class="control-btn secondary-btn" onclick="goBack()">← العودة</button>
    </header>

    <div class="container">
        <div class="player-card">
            <div class="lesson-header">
                <h2 class="lesson-title" id="displayLessonTitle">جاري العرض...</h2>
            </div>

            <!-- حاوية المشغل مع منع كليك يمين -->
            <div class="custom-player-wrapper" id="mediaWrapper" oncontextmenu="return false;">
                <!-- درع حماية يمنع الضغط على روابط يوتيوب العلوية -->
                <div class="video-click-shield" id="clickShield" onclick="togglePlayPause()"></div>
                <div id="plyrTarget"></div>
            </div>

            <div class="player-controls">
                <button class="control-btn secondary-btn" onclick="reloadVideo()">🔄 تحديث المشغل</button>
                <button class="control-btn" onclick="goBack()">العودة للدروس 🎯</button>
            </div>
        </div>
    </div>

    <script>
        let plyrInstance = null;
        let currentTargetUrl = '';

        function getSmartParam(paramName) {
            const href = window.location.href;
            const key = paramName + '=';
            const startIdx = href.indexOf(key);
            if (startIdx === -1) return null;
            let valStart = startIdx + key.length;
            let valEnd = href.length;

            if (paramName === 'url') {
                const nextTitle = href.indexOf('&title=', valStart);
                if (nextTitle !== -1) valEnd = nextTitle;
            }
            const rawVal = href.substring(valStart, valEnd);
            try { return decodeURIComponent(rawVal); } catch(e) { return rawVal; }
        }

        function extractYouTubeId(url) {
            if (!url) return null;
            const regExp = /(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=|shorts\/))([\w-]{11})/;
            const match = url.match(regExp);
            return (match && match[1]) ? match[1] : null;
        }

        function cleanMediaUrl(url) {
            try {
                let parsed = new URL(url);
                return parsed.origin + parsed.pathname;
            } catch(e) {
                return url.split('?')[0];
            }
        }

        function isDirectVideo(url) {
            const clean = cleanMediaUrl(url).toLowerCase();
            return clean.endsWith('.mp4') || clean.endsWith('.webm') || clean.endsWith('.mov');
        }

        // تشغيل/إيقاف الفيديو عند الضغط على الشاشة الشفافة
        function togglePlayPause() {
            if (plyrInstance) {
                plyrInstance.togglePlay();
            }
        }

        function renderPlayer(rawUrl) {
            const wrapper = document.getElementById('mediaWrapper');
            const shield = document.getElementById('clickShield');
            
            if (plyrInstance) { 
                plyrInstance.destroy(); 
                plyrInstance = null; 
            }
            
            currentTargetUrl = rawUrl.trim();

            // 1. تشغيل يوتيوب داخل واجهة Plyr المخصصة فقط
            const ytId = extractYouTubeId(currentTargetUrl);
            if (ytId) {
                shield.style.display = 'block'; // تفعيل الدرع الواقي
                wrapper.innerHTML = `
                    <div class="video-click-shield" onclick="togglePlayPause()"></div>
                    <div id="plyrTarget" data-plyr-provider="youtube" data-plyr-embed-id="${ytId}"></div>
                `;

                plyrInstance = new Plyr('#plyrTarget', {
                    controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'settings', 'pip', 'fullscreen'],
                    youtube: { 
                        noCookie: true, 
                        rel: 0, 
                        showinfo: 0, 
                        iv_load_policy: 3, 
                        modestbranding: 1,
                        controls: 0
                    }
                });
                return;
            }

            // 2. تشغيل الفيديو المباشر (.mp4) مثل Railway
            if (isDirectVideo(currentTargetUrl)) {
                shield.style.display = 'none'; // لا نحتاج درع مع الميديا المباشرة
                const cleanUrl = cleanMediaUrl(currentTargetUrl);
                wrapper.innerHTML = `
                    <video id="plyrTarget" controls playsinline style="width:100%;">
                        <source src="${cleanUrl}" type="video/mp4">
                        <source src="${currentTargetUrl}" type="video/mp4">
                    </video>`;

                plyrInstance = new Plyr('#plyrTarget', {
                    controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'settings', 'pip', 'fullscreen']
                });
                return;
            }

            // 3. التضمين الاحتياطي
            shield.style.display = 'none';
            wrapper.innerHTML = `<iframe src="${currentTargetUrl}" style="width:100%; height:450px; border:0;" allowfullscreen></iframe>`;
        }

        window.onload = function() {
            const rawUrl = getSmartParam('url');
            const rawTitle = getSmartParam('title');
            if (rawTitle) document.getElementById('displayLessonTitle').innerText = rawTitle;
            if (rawUrl) renderPlayer(rawUrl);
        };

        function reloadVideo() { if (currentTargetUrl) renderPlayer(currentTargetUrl); }
        function goBack() { window.history.back(); }
    </script>
</body>
</html>
