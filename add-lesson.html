<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>On Fire Academy - إدارة وإضافة الدروس</title>
    <!-- استيراد خط Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <!-- استيراد مكتبات Firebase عبر CDN -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Cairo", Arial, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #cbd5e1;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .container {
            max-width: 750px;
            margin: auto;
            background: #111827;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 20px 30px -5px rgba(0, 0, 0, 0.6);
            border: 1px solid #1f2937;
            width: 100%;
            position: relative;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        h2 { 
            color: #ffffff; 
            font-size: 22px; 
            font-weight: 900;
            margin: 0;
        }
        .back-btn {
            background: #374151;
            width: auto;
            padding: 8px 16px;
            font-size: 13px;
            margin: 0;
            text-decoration: none;
            color: #fff;
            border-radius: 8px;
            font-weight: 700;
            transition: all 0.2s ease;
        }
        .back-btn:hover { background: #4b5563; }

        .form-section, .search-section, .stats-section {
            background: #1f2937;
            padding: 18px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid #374151;
        }
        .search-section { background: #0f172a; border-color: #1e293b; }
        .stats-section { display: flex; justify-content: space-between; align-items: center; background: #0f172a; border-color: #1e293b; font-size: 14px; font-weight: bold; color: #38bdf8; }
        
        .form-group { margin-bottom: 15px; }
        label { 
            display: block; 
            margin-bottom: 6px; 
            font-weight: 700; 
            font-size: 13px; 
            color: #d1d5db;
        }
        input, select, button {
            width: 100%;
            padding: 12px;
            border: 1px solid #374151;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
            background-color: #030712;
            color: #fff;
            outline: none;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        input:disabled, select:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            background-color: #111827;
        }
        input:focus, select:focus {
            border-color: #ff6b00;
            box-shadow: 0 0 0 3px rgba(255, 107, 0, 0.15);
        }
        button {
            background: linear-gradient(135deg, #ff6b00, #e65c00);
            color: white;
            border: none;
            font-weight: 700;
            cursor: pointer;
            margin-top: 5px;
            transition: all 0.2s ease;
            font-size: 16px;
            box-shadow: 0 4px 12px rgba(255, 107, 0, 0.3);
        }
        button:hover { 
            background: linear-gradient(135deg, #e65c00, #cc5200); 
            transform: translateY(-1px);
        }
        button:active {
            transform: translateY(0);
        }
        .name-list {
            background: #030712;
            border: 1px solid #1f2937;
            border-radius: 8px;
            margin-top: 6px;
            max-height: 220px;
            overflow-y: auto;
        }
        .name-item {
            padding: 10px 14px;
            border-bottom: 1px solid #1f2937;
            cursor: pointer;
            font-size: 14px;
            color: #cbd5e1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.15s ease;
        }
        .name-item:last-child { border-bottom: none; }
        .name-item:hover { background-color: #1e293b; color: #ff6b00; font-weight: bold; }
        .action-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
        }
        .edit-mode-btn { background: linear-gradient(135deg, #f59e0b, #d97706); color: #000; box-shadow: 0 4px 12px rgba(245, 158, 11, 0.2); }
        .edit-mode-btn:hover { background: linear-gradient(135deg, #d97706, #b45309); color: #fff; }
        .delete-mode-btn { background: linear-gradient(135deg, #ef4444, #dc2626); box-shadow: 0 4px 12px rgba(239, 68, 68, 0.2); }
        .delete-mode-btn:hover { background: linear-gradient(135deg, #dc2626, #b91c1c); }
        .new-mode-btn { background: linear-gradient(135deg, #10b981, #059669); box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2); }
        .new-mode-btn:hover { background: linear-gradient(135deg, #059669, #047857); }

        /* التوست للتنبيهات العائمة */
        #toast {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #1f2937;
            color: #fff;
            padding: 12px 24px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #374151;
            font-size: 14px;
            font-weight: 700;
            z-index: 1000;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        #toast.success { border-color: #10b981; background: #064e3b; color: #a7f3d0; }
        #toast.error { border-color: #ef4444; background: #7f1d1d; color: #fecaca; }
        #toast.info { border-color: #3b82f6; background: #1e3a8a; color: #bfdbfe; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-bar">
        <h2>On Fire Academy - إدارة الدروس</h2>
        <a href="control.html" class="back-btn">⬅ العودة للكنترول</a>
    </div>

    <!-- الإحصائيات -->
    <div class="stats-section">
        <span id="totalLessonsCount">📊 إجمالي الدروس: جاري التحميل...</span>
        <button id="refreshBtn" style="width: auto; padding: 6px 14px; font-size: 13px; margin:0;">🔄 تحديث</button>
    </div>

    <!-- البحث الفوري عن الدروس -->
    <div class="search-section">
        <label>🔍 بحث سريع (باسم الدرس، المدرس، الصف، أو الوحدة):</label>
        <input type="text" id="searchInput" placeholder="اكتب للبحث..." autocomplete="off">
        <div id="lessonListContainer" class="name-list" style="display: none;"></div>
    </div>

    <!-- نموذج بيانات الدرس -->
    <div class="form-section">
        <!-- حقول مخفية لحفظ المسارات والبيانات القديمة عند التعديل -->
        <input type="hidden" id="originalLessonId" value="">
        <input type="hidden" id="originalGrade" value="">
        <input type="hidden" id="originalTeacher" value="">
        <input type="hidden" id="originalUnit" value="">
        <input type="hidden" id="originalCreatedAt" value="">

        <!-- حقل المدرس -->
        <div class="form-group">
            <label>المدرس:</label>
            <select id="teacherSelect">
                <option value="إبراهيم الدوسري">إبراهيم الدوسري</option>
                <option value="محمود حسان">محمود حسان</option>
            </select>
        </div>

        <!-- حقل الصف الدراسي -->
        <div class="form-group">
            <label>الصف الدراسي:</label>
            <select id="gradeSelect">
                <option value="أولى إعدادي">أولى إعدادي</option>
                <option value="ثانية إعدادي">ثانية إعدادي</option>
                <option value="ثالثة إعدادي">ثالثة إعدادي</option>
                <option value="أولى ثانوي">أولى ثانوي</option>
                <option value="ثانية ثانوي">ثانية ثانوي</option>
                <option value="ثالثة ثانوي">ثالثة ثانوي</option>
            </select>
        </div>

        <div class="form-group">
            <label>الوحدة الدراسية:</label>
            <select id="unitSelect">
                <option value="الوحدة الأولى">الوحدة الأولى</option>
                <option value="الوحدة الثانية">الوحدة الثانية</option>
                <option value="الوحدة الثالثة">الوحدة الثالثة</option>
                <option value="الوحدة الرابعة">الوحدة الرابعة</option>
                <option value="الوحدة الخامسة">الوحدة الخامسة</option>
            </select>
        </div>

        <div class="form-group">
            <label>اسم الدرس:</label>
            <input type="text" id="lessonNameInput" placeholder="أدخل اسم الدرس..." autocomplete="off">
        </div>

        <div class="form-group">
            <label>لينك فيديو اليوتيوب (غير مدرج / عادي):</label>
            <input type="text" id="youtubeUrlInput" placeholder="الصق لينك يوتيوب هنا..." autocomplete="off">
        </div>

        <!-- أزرار التحكم -->
        <div id="defaultAddBtnContainer">
            <button id="addLessonBtn">إضافة الدرس الآن 🚀</button>
        </div>

        <div id="selectedLessonActions" class="action-buttons" style="display: none;">
            <button id="editBtn" class="edit-mode-btn">تعديل</button>
            <button id="deleteBtn" class="delete-mode-btn">حذف</button>
            <button id="resetBtn" class="new-mode-btn">إضافة جديد</button>
        </div>
    </div>
</div>

<!-- عنصر التنبيهات العائمة Toast -->
<div id="toast"></div>

<script>
    const firebaseConfig = {
        databaseURL: "https://doshas-e5d12-default-rtdb.firebaseio.com/"
    };
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    let allLessonsCache = [];

    // دالة لعرض التنبيهات العائمة (Toast)
    function showToast(message, type = 'info') {
        const toast = document.getElementById("toast");
        toast.className = `show ${type}`;
        toast.innerText = message;
        setTimeout(() => {
            toast.className = toast.className.replace("show", "").trim();
        }, 3200);
    }

    // دالة لتوحيد النصوص العربية (Arabic Normalization) لضمان دقة البحث
    function normalizeArabicText(text) {
        if (!text) return '';
        return text
            .toLowerCase()
            .replace(/[أإآآ]/g, 'ا')
            .replace(/ة/g, 'ه')
            .replace(/ى/g, 'ي')
            .replace(/[\u064B-\u0652]/g, '')
            .trim();
    }

    // دالة لتحديث وعرض خيارات الصفوف بناءً على المدرس المختار
    function updateGradeDropdownBasedOnTeacher(selectedTeacher, targetGrade = null) {
        const gradeSelect = document.getElementById("gradeSelect");
        let currentGrade = targetGrade || gradeSelect.value;
        
        gradeSelect.innerHTML = "";

        let allGrades = [
            "أولى إعدادي", 
            "ثانية إعدادي", 
            "ثالثة إعدادي", 
            "أولى ثانوي", 
            "ثانية ثانوي", 
            "ثالثة ثانوي"
        ];

        allGrades.forEach(gradeName => {
            // شرط محمود حسان: لا يدرس للصف الثاني الثانوي
            if (selectedTeacher === "محمود حسان" && gradeName === "ثانية ثانوي") {
                return;
            }

            let option = document.createElement("option");
            option.value = gradeName;
            option.textContent = gradeName;
            gradeSelect.appendChild(option);
        });

        let options = Array.from(gradeSelect.options).map(o => o.value);
        if (currentGrade && options.includes(currentGrade)) {
            gradeSelect.value = currentGrade;
        } else if (gradeSelect.options.length > 0) {
            gradeSelect.selectedIndex = 0;
        }
    }

    // تحميل جميع الدروس من فايربيس
    async function loadLessonsData() {
        const countSpan = document.getElementById("totalLessonsCount");
        countSpan.innerText = "📊 جاري تحميل الدروس...";
        try {
            const snapshot = await db.ref('lessons').once('value');
            allLessonsCache = [];
            
            if (snapshot.exists()) {
                snapshot.forEach((gradeSnap) => {
                    let gradeKey = gradeSnap.key;
                    let gradeName = gradeKey.replace(/_/g, ' ');

                    gradeSnap.forEach((teacherSnap) => {
                        let teacherKey = teacherSnap.key;
                        let teacherName = teacherKey.replace(/_/g, ' ');

                        teacherSnap.forEach((unitSnap) => {
                            let unitKey = unitSnap.key;
                            let unitName = unitKey.replace(/_/g, ' ');

                            unitSnap.forEach((lessonSnap) => {
                                let lessonId = lessonSnap.key;
                                let lessonData = lessonSnap.val() || {};

                                allLessonsCache.push({
                                    id: lessonId,
                                    gradeKey: gradeKey,
                                    teacherKey: teacherKey,
                                    unitKey: unitKey,
                                    grade: gradeName,
                                    teacher: teacherName,
                                    unit: unitName,
                                    lessonName: lessonData.lessonName || '',
                                    youtubeUrl: lessonData.youtubeUrl || '',
                                    createdAt: lessonData.createdAt || Date.now()
                                });
                            });
                        });
                    });
                });
            }
            countSpan.innerText = `📊 إجمالي الدروس المسجلة: ${allLessonsCache.length}`;
        } catch (error) {
            console.error("خطأ في جلب الدروس:", error);
            countSpan.innerText = "📊 خطأ في الاتصال بقاعدة البيانات";
            showToast("تعذر جلب الدروس من قاعدة البيانات", "error");
        }
    }

    // البحث الفوري عن الدروس مع دعم البحث المرن
    function filterLessonsData() {
        let rawQuery = document.getElementById("searchInput").value;
        let query = normalizeArabicText(rawQuery);
        let listContainer = document.getElementById("lessonListContainer");

        if (!query) {
            listContainer.style.display = "none";
            listContainer.innerHTML = "";
            return;
        }

        let matched = allLessonsCache.filter(item => {
            let nameNorm = normalizeArabicText(item.lessonName);
            let teacherNorm = normalizeArabicText(item.teacher);
            let gradeNorm = normalizeArabicText(item.grade);
            let unitNorm = normalizeArabicText(item.unit);

            return nameNorm.includes(query) || 
                   teacherNorm.includes(query) || 
                   gradeNorm.includes(query) || 
                   unitNorm.includes(query);
        });

        if (matched.length === 0) {
            listContainer.style.display = "block";
            listContainer.innerHTML = '<div style="padding: 10px 14px; color: #ef4444; font-size: 14px; text-align: center;">لا توجد نتائج مطابقة</div>';
            return;
        }

        listContainer.style.display = "block";
        listContainer.innerHTML = "";
        
        matched.forEach(item => {
            let div = document.createElement("div");
            div.className = "name-item";
            div.innerHTML = `<span>📚 ${item.lessonName} <span style="color:#94a3b8; font-size:12px;">(${item.teacher})</span></span> <span style="color:#38bdf8; font-size:12px;">${item.grade} | ${item.unit}</span>`;
            div.onclick = function() {
                selectLesson(item);
            };
            listContainer.appendChild(div);
        });
    }

    // اختيار درس من القائمة لتعديله أو حذفه
    function selectLesson(item) {
        document.getElementById("teacherSelect").value = item.teacher;
        updateGradeDropdownBasedOnTeacher(item.teacher, item.grade);
        document.getElementById("unitSelect").value = item.unit;
        document.getElementById("lessonNameInput").value = item.lessonName;
        document.getElementById("youtubeUrlInput").value = item.youtubeUrl;

        document.getElementById("originalLessonId").value = item.id;
        document.getElementById("originalGrade").value = item.gradeKey;
        document.getElementById("originalTeacher").value = item.teacherKey;
        document.getElementById("originalUnit").value = item.unitKey;
        document.getElementById("originalCreatedAt").value = item.createdAt || '';

        document.getElementById("teacherSelect").disabled = true;
        document.getElementById("gradeSelect").disabled = true;
        document.getElementById("unitSelect").disabled = true;
        document.getElementById("lessonNameInput").disabled = true;
        document.getElementById("youtubeUrlInput").disabled = true;

        document.getElementById("defaultAddBtnContainer").style.display = "none";
        document.getElementById("selectedLessonActions").style.display = "grid";
        document.getElementById("lessonListContainer").style.display = "none";
        document.getElementById("searchInput").value = "";

        showToast(`تم تحديد درس: "${item.lessonName}"`, "info");
    }

    // إعادة النماذج لوضع الإضافة الجديدة
    function resetToAddNewLesson() {
        let currentTeacher = document.getElementById("teacherSelect").value;
        updateGradeDropdownBasedOnTeacher(currentTeacher);
        document.getElementById("unitSelect").value = "الوحدة الأولى";
        document.getElementById("lessonNameInput").value = "";
        document.getElementById("youtubeUrlInput").value = "";
        
        document.getElementById("originalLessonId").value = "";
        document.getElementById("originalGrade").value = "";
        document.getElementById("originalTeacher").value = "";
        document.getElementById("originalUnit").value = "";
        document.getElementById("originalCreatedAt").value = "";

        document.getElementById("teacherSelect").disabled = false;
        document.getElementById("gradeSelect").disabled = false;
        document.getElementById("unitSelect").disabled = false;
        document.getElementById("lessonNameInput").disabled = false;
        document.getElementById("youtubeUrlInput").disabled = false;

        document.getElementById("defaultAddBtnContainer").style.display = "block";
        document.getElementById("selectedLessonActions").style.display = "none";
        
        document.getElementById("selectedLessonActions").innerHTML = `
            <button id="editBtn" class="edit-mode-btn">تعديل</button>
            <button id="deleteBtn" class="delete-mode-btn">حذف</button>
            <button id="resetBtn" class="new-mode-btn">إضافة جديد</button>
        `;
        bindLessonActionButtons();
    }

    // إضافة درس جديد
    async function saveNewLesson() {
        const teacher = document.getElementById("teacherSelect").value;
        const grade = document.getElementById("gradeSelect").value;
        const unit = document.getElementById("unitSelect").value;
        const lessonName = document.getElementById("lessonNameInput").value.trim();
        const youtubeUrl = document.getElementById("youtubeUrlInput").value.trim();

        if (!lessonName || !youtubeUrl) {
            showToast("الرجاء إدخال اسم الدرس ولينك يوتيوب!", "error");
            return;
        }

        const addBtn = document.getElementById("addLessonBtn");
        addBtn.disabled = true;
        addBtn.innerText = "جاري الحفظ... ⏳";

        let safeGrade = grade.replace(/\s+/g, '_');
        let safeTeacher = teacher.replace(/\s+/g, '_');
        let safeUnit = unit.replace(/\s+/g, '_');
        let lessonId = 'les_' + Date.now();

        try {
            await db.ref(`lessons/${safeGrade}/${safeTeacher}/${safeUnit}/${lessonId}`).set({
                lessonName: lessonName,
                youtubeUrl: youtubeUrl,
                createdAt: Date.now()
            });
            showToast("تم إضافة الدرس بنجاح إلى فايربيس! 🎉", "success");
            resetToAddNewLesson();
            loadLessonsData();
        } catch (e) {
            console.error(e);
            showToast("حدث خطأ أثناء الحفظ في قاعدة البيانات.", "error");
        } finally {
            addBtn.disabled = false;
            addBtn.innerText = "إضافة الدرس الآن 🚀";
        }
    }

    // حفظ التعديلات للدرس
    async function saveEditedLesson() {
        const lessonId = document.getElementById("originalLessonId").value;
        const oldGrade = document.getElementById("originalGrade").value;
        const oldTeacher = document.getElementById("originalTeacher").value;
        const oldUnit = document.getElementById("originalUnit").value;
        const origCreatedAt = document.getElementById("originalCreatedAt").value;

        const newTeacher = document.getElementById("teacherSelect").value;
        const newGrade = document.getElementById("gradeSelect").value;
        const newUnit = document.getElementById("unitSelect").value;
        const lessonName = document.getElementById("lessonNameInput").value.trim();
        const youtubeUrl = document.getElementById("youtubeUrlInput").value.trim();

        if (!lessonName || !youtubeUrl) {
            showToast("الرجاء ملء البيانات المطلوبة!", "error");
            return;
        }

        const saveBtn = document.getElementById("saveEditLessonBtn");
        if (saveBtn) {
            saveBtn.disabled = true;
            saveBtn.innerText = "جاري التحديث... ⏳";
        }

        let safeGrade = newGrade.replace(/\s+/g, '_');
        let safeTeacher = newTeacher.replace(/\s+/g, '_');
        let safeUnit = newUnit.replace(/\s+/g, '_');

        try {
            if (oldGrade !== safeGrade || oldTeacher !== safeTeacher || oldUnit !== safeUnit) {
                await db.ref(`lessons/${oldGrade}/${oldTeacher}/${oldUnit}/${lessonId}`).remove();
            }

            await db.ref(`lessons/${safeGrade}/${safeTeacher}/${safeUnit}/${lessonId}`).set({
                lessonName: lessonName,
                youtubeUrl: youtubeUrl,
                createdAt: origCreatedAt ? parseInt(origCreatedAt) : Date.now(),
                updatedAt: Date.now()
            });

            showToast("تم تحديث بيانات الدرس بنجاح! ✏️", "success");
            resetToAddNewLesson();
            loadLessonsData();
        } catch (e) {
            console.error(e);
            showToast("حدث خطأ أثناء التعديل.", "error");
        }
    }

    // حذف الدرس
    async function deleteSelectedLesson() {
        const lessonId = document.getElementById("originalLessonId").value;
        const gradeKey = document.getElementById("originalGrade").value;
        const teacherKey = document.getElementById("originalTeacher").value;
        const unitKey = document.getElementById("originalUnit").value;

        if (confirm("هل أنت متأكد من حذف هذا الدرس نهائياً؟")) {
            try {
                await db.ref(`lessons/${gradeKey}/${teacherKey}/${unitKey}/${lessonId}`).remove();
                showToast("تم حذف الدرس بنجاح.", "success");
                resetToAddNewLesson();
                loadLessonsData();
            } catch (e) {
                console.error(e);
                showToast("حدث خطأ أثناء الحذف.", "error");
            }
        }
    }

    function enableLessonEditing() {
        document.getElementById("teacherSelect").disabled = false;
        document.getElementById("gradeSelect").disabled = false;
        document.getElementById("unitSelect").disabled = false;
        document.getElementById("lessonNameInput").disabled = false;
        document.getElementById("youtubeUrlInput").disabled = false;

        let actionsDiv = document.getElementById("selectedLessonActions");
        actionsDiv.style.display = "grid";
        actionsDiv.innerHTML = `
            <button id="saveEditLessonBtn" class="new-mode-btn" style="grid-column: span 2;">حفظ التعديلات</button>
            <button id="cancelEditLessonBtn" class="delete-mode-btn">إلغاء</button>
        `;

        document.getElementById("saveEditLessonBtn").onclick = saveEditedLesson;
        document.getElementById("cancelEditLessonBtn").onclick = resetToAddNewLesson;
    }

    // ربط الأحداث بالأزرار
    function bindLessonActionButtons() {
        const addBtn = document.getElementById("addLessonBtn");
        if (addBtn) addBtn.onclick = saveNewLesson;

        const editBtn = document.getElementById("editBtn");
        if (editBtn) editBtn.onclick = enableLessonEditing;

        const deleteBtn = document.getElementById("deleteBtn");
        if (deleteBtn) deleteBtn.onclick = deleteSelectedLesson;

        const resetBtn = document.getElementById("resetBtn");
        if (resetBtn) resetBtn.onclick = resetToAddNewLesson;

        const refreshBtn = document.getElementById("refreshBtn");
        if (refreshBtn) refreshBtn.onclick = loadLessonsData;

        const searchInput = document.getElementById("searchInput");
        if (searchInput) searchInput.oninput = filterLessonsData;

        const teacherSelect = document.getElementById("teacherSelect");
        if (teacherSelect) {
            teacherSelect.onchange = function() {
                updateGradeDropdownBasedOnTeacher(this.value);
            };
        }
    }

    window.onload = function() {
        updateGradeDropdownBasedOnTeacher("إبراهيم الدوسري");
        loadLessonsData();
        bindLessonActionButtons();
    };
</script>

</body>
</html>
